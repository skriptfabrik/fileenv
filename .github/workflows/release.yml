name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    name: "Build binary (${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Determine archive name
        id: vars
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          suffix="${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ -n "${{ matrix.goarm }}" ]; then
            suffix="${suffix}v${{ matrix.goarm }}"
          fi
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"
          echo "archive_name=fileenv_${version#v}_${suffix}" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p dist
          bin=fileenv
          [ "$GOOS" = "windows" ] && bin=fileenv.exe
          go build -trimpath \
            -ldflags="-s -w -X main.version=${{ steps.vars.outputs.version }}" \
            -o "dist/${bin}" .

      - name: Package
        id: package
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            asset="${{ steps.vars.outputs.archive_name }}.zip"
            zip "${asset}" fileenv.exe
          else
            asset="${{ steps.vars.outputs.archive_name }}.tar.gz"
            tar -czf "${asset}" fileenv
          fi
          echo "asset=dist/${asset}" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.asset }}

  checksums:
    name: Publish checksums.txt
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir dist
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir dist \
            --pattern "fileenv_*"

      - name: Generate checksums.txt
        run: |
          cd dist
          sha256sum -- * > checksums.txt

      - name: Upload checksums
        uses: softprops/action-gh-release@v2
        with:
          files: dist/checksums.txt

  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata / tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/skriptfabrik/fileenv
            skriptfabrik/fileenv
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ github.event.release.prerelease == false }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
